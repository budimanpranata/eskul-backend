services:
  postgres:
    image: postgres:16-alpine
    container_name: eskul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eskul
      POSTGRES_PASSWORD: eskul_secret
      POSTGRES_DB: eskul
    ports:
      # Host port configurable via .env (POSTGRES_HOST_PORT) untuk hindari bentrok
      # dengan PostgreSQL lain di mesin dev. Bind ke 127.0.0.1 saja.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - eskul_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eskul -d eskul']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eskul-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - eskul_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: eskul-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://eskul:eskul_secret@postgres:5432/eskul?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '${API_HOST_PORT:-3100}:3000'

volumes:
  eskul_pgdata:
  eskul_redisdata:
